[package]
name = "deepdeck-engine-runtime"
version = "0.1.0"
edition = "2024"

[features]
default = ["oracle-compilation"]
oracle-compilation = ["dep:deepdeck-oracle"]
ci-test-partition = []
ci-unit-tests-1 = ["ci-test-partition"]
ci-unit-tests-2 = ["ci-test-partition"]
ci-unit-tests-3 = ["ci-test-partition"]
ci-unit-tests-4 = ["ci-test-partition"]

[dependencies]
deepdeck-card-domain = { path = "../deepdeck-card-domain" }
deepdeck-oracle = { path = "../deepdeck-oracle", optional = true }
rand = "0.8"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
name = "deepdeck_engine_runtime"
path = "src/lib.rs"
