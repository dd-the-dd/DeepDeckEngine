[package]
name = "deepdeck-oracle-engine-contracts"
version = "0.1.0"
edition = "2024"
publish = false

[features]
parser-standalone = []
# Runs tests quarantined in docs/coverage-targets.md as ordinary tests.
# Without it they are reported as ignored with their coverage-target reason;
# CI executes them with `-- --ignored` in its continue-on-error step.
coverage-targets = []
ci-test-partition = []
ci-unit-tests-1 = ["ci-test-partition"]
ci-unit-tests-2 = ["ci-test-partition"]
ci-unit-tests-3 = ["ci-test-partition"]
ci-unit-tests-4 = ["ci-test-partition"]

[dependencies]
deepdeck-engine-runtime = { path = "../deepdeck-engine-runtime", default-features = false }
deepdeck-oracle = { path = "../deepdeck-oracle" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Contract tests that compile playable cards (card_structure_factory,
# emeritus_of_ideation) need the runtime model built with Oracle compilation;
# the library itself keeps the runtime boundary without it.
[dev-dependencies]
deepdeck-engine-runtime = { path = "../deepdeck-engine-runtime", features = ["oracle-compilation"] }

[lib]
name = "deepdeck_oracle_engine_contracts"
path = "src/lib.rs"
