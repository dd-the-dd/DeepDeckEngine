[package]
name = "deepdeck-oracle"
version = "0.1.0"
edition = "2024"
# `examples/audit_parser_set_tests.rs` is a test module of the audit example,
# not an example of its own.
autoexamples = false

[features]
default = ["parser-standalone"]
parser-standalone = []
automata-trace = []
audit-cli = ["dep:ureq"]
# Runs tests quarantined in docs/coverage-targets.md as ordinary tests.
# Without it they are reported as ignored with their coverage-target reason;
# CI executes them with `-- --ignored` in its continue-on-error step.
coverage-targets = []
ci-test-partition = []
ci-unit-tests-1 = ["ci-test-partition"]
ci-unit-tests-2 = ["ci-test-partition"]
ci-unit-tests-3 = ["ci-test-partition"]
ci-unit-tests-4 = ["ci-test-partition"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"], optional = true }

[lib]
name = "deepdeck_oracle"
path = "src/lib.rs"

[[example]]
name = "audit_parser_set"
path = "examples/audit_parser_set.rs"
required-features = ["audit-cli"]

[[example]]
name = "analyze_local_abilities"
path = "examples/analyze_local_abilities.rs"

[[example]]
name = "debug_oracle"
path = "examples/debug_oracle.rs"

[[example]]
name = "export_traced_cards"
path = "examples/export_traced_cards.rs"
