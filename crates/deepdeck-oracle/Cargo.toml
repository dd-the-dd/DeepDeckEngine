[package]
name = "deepdeck-oracle"
version = "0.1.0"
edition = "2024"

[features]
default = ["parser-standalone"]
parser-standalone = []
audit-cli = ["dep:ureq"]
ci-test-partition = []
ci-unit-tests-1 = ["ci-test-partition"]
ci-unit-tests-2 = ["ci-test-partition"]
ci-unit-tests-3 = ["ci-test-partition"]
ci-unit-tests-4 = ["ci-test-partition"]

[dependencies]
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"], optional = true }

[dev-dependencies]
# Private parser tests also assert engine executability. Keep that boundary
# test-only and parser-free so the parser itself is still compiled once.
deepdeck-engine-runtime = { path = "../deepdeck-engine-runtime", default-features = false }

[lib]
name = "deepdeck_oracle"
path = "src/lib.rs"

[[example]]
name = "audit_parser_set"
path = "examples/audit_parser_set.rs"
required-features = ["audit-cli"]
