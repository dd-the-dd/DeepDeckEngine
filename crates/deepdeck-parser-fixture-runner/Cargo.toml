[package]
name = "deepdeck-parser-fixture-runner"
version = "0.1.0"
edition = "2024"
publish = false
default-run = "deepdeck-parser-fixture-runner"

[features]
# Local audits omit networking dependencies to preserve the fixture-runner
# dependency feature graph. audit-cli retains the existing remote CLI capability.
local-audit = []
audit-cli = ["local-audit", "dep:ureq"]

[dependencies]
deepdeck-oracle = { path = "../deepdeck-oracle" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"], optional = true }

[lib]
name = "deepdeck_parser_fixture_runner"
path = "src/lib.rs"

[[bin]]
name = "deepdeck-parser-fixture-runner"
path = "src/main.rs"

[[bin]]
name = "audit_parser_set"
path = "../deepdeck-oracle/examples/audit_parser_set.rs"
required-features = ["local-audit"]
