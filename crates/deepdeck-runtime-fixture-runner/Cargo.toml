[package]
name = "deepdeck-runtime-fixture-runner"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
deepdeck-engine-runtime = { path = "../deepdeck-engine-runtime", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
name = "deepdeck_runtime_fixture_runner"
path = "src/lib.rs"

[[bin]]
name = "deepdeck-runtime-fixture-runner"
path = "src/main.rs"
