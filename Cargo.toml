[package]
name = "mtg-engine"
version = "0.1.0"
edition = "2024"

[workspace]
members = [
    ".",
    "crates/deepdeck-oracle",
    "crates/deepdeck-engine-runtime",
    "crates/deepdeck-runtime-fixture-runner",
    "crates/deepdeck-contract-fixture-runner",
    "crates/deepdeck-parser-fixture-runner",
    "crates/deepdeck-oracle-engine-contracts",
]
resolver = "3"

[features]
# CI enables exactly one of these internal features at a time so the private-
# access unit tests link as bounded binaries. Normal `cargo test` enables none
# of them and continues to compile and run the complete unit-test suite.
ci-test-partition = ["deepdeck-engine-runtime/ci-test-partition"]
ci-unit-tests-1 = ["ci-test-partition", "deepdeck-engine-runtime/ci-unit-tests-1"]
ci-unit-tests-2 = ["ci-test-partition", "deepdeck-engine-runtime/ci-unit-tests-2"]
ci-unit-tests-3 = ["ci-test-partition", "deepdeck-engine-runtime/ci-unit-tests-3"]
ci-unit-tests-4 = ["ci-test-partition", "deepdeck-engine-runtime/ci-unit-tests-4"]

[dependencies]
dotenvy = "0.15"
rand = "0.8"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
tungstenite = "0.27"
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }
deepdeck-oracle = { path = "crates/deepdeck-oracle" }
deepdeck-engine-runtime = { path = "crates/deepdeck-engine-runtime" }

[lib]
name = "mtg_engine"
path = "src/lib.rs"

[[bin]]
name = "mtg-engine-server"
path = "src/main.rs"

# Keep symbols small while retaining incremental artifacts for local iteration.
# The repository test wrapper trims incremental caches when target exceeds its
# configured disk budget.
[profile.dev]
debug = 0
incremental = true

[profile.test]
debug = 0
incremental = true
