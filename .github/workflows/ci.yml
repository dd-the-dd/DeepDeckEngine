name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_BUILD_JOBS: 2
  RUST_MIN_STACK: 16777216

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Check formatting
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check
      - name: Compile every target
        if: runner.os == 'Linux'
        run: cargo check --locked --all-targets
      - name: Verify unit-test partitions
        shell: pwsh
        run: ./scripts/check-unit-test-partitions.ps1
      - name: Run partitioned unit tests
        shell: pwsh
        run: |
          cargo test --locked -p deepdeck-oracle --tests
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          foreach ($partition in 1..4) {
            cargo test --locked -p deepdeck-oracle --lib --no-default-features --features "ci-unit-tests-$partition"
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
            cargo test --locked -p deepdeck-engine-runtime --lib --no-default-features --features "ci-unit-tests-$partition"
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
            cargo test --locked -p mtg-engine --lib --no-default-features --features "ci-unit-tests-$partition"
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
          }
          cargo test --locked -p deepdeck-oracle-engine-contracts --tests
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
      - name: Run integration tests
        run: >-
          cargo test --locked
          --test agent_manifest_contract
          --test backend_contract
          --test best_of_session
          --test commander_qualification
          --test deck_storage_sections
          --test outside_game_dungeons
          --test interactive_session
          --test multiplayer_simulation
          --test playable_model
          --test random_game_engine
      - name: Run quarantined reviewed-fixture audits
        continue-on-error: true
        run: >-
          cargo test --locked
          --test four_color_random_games
          --test hob_parser_batch
          --test hoc_parser_batch
          --test oracle_ground_truth
      - name: Audit public tree
        shell: pwsh
        run: ./scripts/check-public-tree.ps1
